<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyForge — Password &amp; Passphrase Generator</title>
<meta name="description" content="Free, offline password and passphrase generator. Runs entirely in your browser — nothing is sent anywhere." />
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 560px;
  }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .tagline { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
  .tabs {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.25rem;
  }
  .tabs button {
    flex: 1;
    padding: .5rem;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: .95rem;
  }
  .tabs button.active {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(88, 166, 255, .12);
  }
  .output-row {
    display: flex;
    gap: .5rem;
    align-items: stretch;
    margin-bottom: .5rem;
  }
  #output {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.05rem;
    word-break: break-all;
    min-height: 3.4rem;
    display: flex;
    align-items: center;
  }
  #copyBtn {
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 8px;
    padding: 0 1.1rem;
    font-weight: 600;
    font-size: .95rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #copyBtn.copied { background: var(--good); }
  .strength-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    margin-bottom: .35rem;
    overflow: hidden;
  }
  .strength-bar > div { height: 100%; width: 0%; transition: width .25s, background .25s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 1.5rem; }
  .panel { display: none; }
  .panel.active { display: block; }
  .controls { display: grid; grid-template-columns: 1fr auto; gap: .75rem 1rem; align-items: center; }
  .controls label { font-size: .9rem; color: var(--muted); }
  .controls .value {
    color: var(--text);
    font-family: ui-monospace, monospace;
    font-size: .9rem;
    min-width: 3ch;
    text-align: right;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: .5rem; font-size: .9rem; color: var(--muted); }
  .check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .sep { color: var(--muted); align-self: center; font-size: .9rem; }
  #regenBtn {
    width: 100%;
    margin-top: 1.5rem;
    padding: .7rem;
    background: rgba(88, 166, 255, .12);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #regenBtn:hover { background: rgba(88, 166, 255, .2); }
  footer {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: .78rem;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>KeyForge</h1>
  <p class="tagline">Runs 100% offline in your browser. Nothing is stored or transmitted.</p>

  <div class="tabs" role="tablist">
    <button id="tabPassword" class="active" role="tab">Password</button>
    <button id="tabPhrase" role="tab">Passphrase</button>
  </div>

  <div class="output-row">
    <div id="output" aria-live="polite"></div>
    <button id="copyBtn" type="button">Copy</button>
  </div>
  <div class="strength-bar"><div id="strengthFill"></div></div>
  <div class="meta"><span id="strengthLabel">—</span><span id="entropyLabel"></span></div>

  <section id="panelPassword" class="panel active" aria-label="Password options">
    <div class="controls">
      <label for="pwLen">Length</label>
      <input type="range" id="pwLen" min="6" max="64" value="20" />
      <span></span><span class="value" id="pwLenVal">20</span>

      <label class="check"><input type="checkbox" id="optUpper" checked /> A–Z</label>
      <label class="check"><input type="checkbox" id="optLower" checked /> a–z</label>
      <label class="check"><input type="checkbox" id="optDigits" checked /> 0–9</label>
      <label class="check"><input type="checkbox" id="optSymbols" /> !@#$%</label>
      <label class="check"><input type="checkbox" id="optNoAmb" /> Avoid lookalikes (0O1lI)</label>
    </div>
  </section>

  <section id="panelPhrase" class="panel" aria-label="Passphrase options">
    <div class="controls">
      <label for="phWords">Words</label>
      <input type="range" id="phWords" min="3" max="10" value="5" />
      <span></span><span class="value" id="phWordsVal">5</span>

      <label for="phSep">Separator</label>
      <select id="phSep">
        <option value="-">dash ( - )</option>
        <option value=".">dot ( . )</option>
        <option value="_">underscore ( _ )</option>
        <option value="">none</option>
      </select>
      <label class="check"><input type="checkbox" id="phNumber" checked /> Append number</label>
      <label class="check"><input type="checkbox" id="phCap" /> Capitalize words</label>
    </div>
  </section>

  <button id="regenBtn" type="button">↻ Generate new</button>
  <footer>Uses your browser's cryptographically secure random generator (Web Crypto API).</footer>
</main>

<script>

const $ = id => document.getElementById(id);
const out = $("output");

function randInt(max) {
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / max) * max;
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % max;
}

function pick(arr) { return arr[randInt(arr.length)]; }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildPassword() {
  let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let lower = "abcdefghijklmnopqrstuvwxyz";
  let digits = "0123456789";
  let symbols = "!@#$%^&*()-_=+[]{};:,.?/";
  if ($("optNoAmb").checked) {
    upper = upper.replace(/[IO]/g, "");
    lower = lower.replace(/[lo]/g, "");
    digits = digits.replace(/[01]/g, "");
  }
  let pool = "";
  const groups = [];
  if ($("optUpper").checked) { pool += upper; groups.push(upper); }
  if ($("optLower").checked) { pool += lower; groups.push(lower); }
  if ($("optDigits").checked) { pool += digits; groups.push(digits); }
  if ($("optSymbols").checked) { pool += symbols; groups.push(symbols); }
  if (!pool) { pool = lower; groups.push(lower); }

  const len = +$("pwLen").value;
  const chars = groups.map(g => pick(g));
  while (chars.length < len) chars.push(pool[randInt(pool.length)]);
  const pw = shuffle(chars.slice(0, len)).join("");
  return { value: pw, entropy: len * Math.log2(pool.length) };
}

function buildPhrase() {
  const n = +$("phWords").value;
  const sep = $("phSep").value;
  const cap = $("phCap").checked;
  let words = [];
  for (let i = 0; i < n; i++) {
    let w;
    do { w = WORDS[randInt(WORDS.length)]; } while (words.includes(w));
    words.push(cap ? w[0].toUpperCase() + w.slice(1) : w);
  }
  let phrase = words.join(sep);
  let entropy = n * Math.log2(WORDS.length);
  if ($("phNumber").checked) {
    phrase += sep + String(randInt(10000)).padStart(4, "0");
    entropy += Math.log2(10000);
  }
  return { value: phrase, entropy };
}

let last = null;

function rate(entropy) {
  if (entropy < 40) return { label: "Weak", color: "var(--bad)", pct: 25 };
  if (entropy < 60) return { label: "Fair", color: "var(--warn)", pct: 50 };
  if (entropy < 80) return { label: "Strong", color: "var(--good)", pct: 75 };
  return { label: "Excellent", color: "var(--good)", pct: 100 };
}

function render(res) {
  last = res;
  out.textContent = res.value;
  const r = rate(res.entropy);
  const fill = $("strengthFill");
  fill.style.width = r.pct + "%";
  fill.style.background = r.color;
  $("strengthLabel").textContent = "Strength: " + r.label;
  $("entropyLabel").textContent = "~" + Math.round(res.entropy) + " bits of entropy";
}

function generate() {
  render($("tabPhrase").classList.contains("active") ? buildPhrase() : buildPassword());
}

let mode = "password";
function setMode(m) {
  mode = m;
  $("tabPassword").classList.toggle("active", m === "password");
  $("tabPhrase").classList.toggle("active", m === "phrase");
  $("panelPassword").classList.toggle("active", m === "password");
  $("panelPhrase").classList.toggle("active", m === "phrase");
  generate();
}

$("tabPassword").addEventListener("click", () => setMode("password"));
$("tabPhrase").addEventListener("click", () => setMode("phrase"));
$("regenBtn").addEventListener("click", generate);

$("pwLen").addEventListener("input", e => { $("pwLenVal").textContent = e.target.value; generate(); });
$("phWords").addEventListener("input", e => { $("phWordsVal").textContent = e.target.value; generate(); });
["optUpper","optLower","optDigits","optSymbols","optNoAmb"].forEach(id => $(id).addEventListener("change", generate));
["phSep","phNumber","phCap"].forEach(id => $(id).addEventListener("change", generate));

$("copyBtn").addEventListener("click", async () => {
  if (!last) return;
  try { await navigator.clipboard.writeText(last.value); } catch {
    const ta = document.createElement("textarea");
    ta.value = last.value;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const btn = $("copyBtn");
  btn.textContent = "Copied!";
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1200);
});

generate();
</script>
</body>
